name: Android CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [ 29 ]

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2: Setup JDK 17
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle' # Enable caching to speed up builds

      # Step 3: Build both apps
      - name: Build all modules
        run: ./gradlew clean assembleDebug assembleDebugAndroidTest --stacktrace

      # Step 4: Run tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Instrumented Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      #      # Step 5: Upload test reports as artifacts
      #      - name: Upload Test Reports
      #        if: always()
      #        uses: actions/upload-artifact@v4
      #        with:
      #          name: test-reports
      #          path: |
      #            **/build/reports/tests/testDebugUnitTest/
      #            **/build/reports/tests/test/

      # Step 6: Upload test reports as artifacts
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: '**/build/outputs/apk/**/*.apk'