name: Android CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2: Setup JDK 17
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle' # Enable caching to speed up builds

      # Step 3: Build both apps
      - name: Build all modules
        run: ./gradlew clean assembleDebug assembleDebugAndroidTest --stacktrace

      # Step 4: Run tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Instrumented Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      #      # Step 5: Upload test reports as artifacts
      #      - name: Upload Test Reports
      #        if: always()
      #        uses: actions/upload-artifact@v4
      #        with:
      #          name: test-reports
      #          path: |
      #            **/build/reports/tests/testDebugUnitTest/
      #            **/build/reports/tests/test/

      # Step 6: Upload test reports as artifacts
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: '**/build/outputs/apk/**/*.apk'